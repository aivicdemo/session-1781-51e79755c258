<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>契約・提案資料管理システム</title>
  <style>
:root {
  --primary: #d4af37;
  --primary-hover: #c9a23e;
  --bg-main: #0f0f0f;
  --bg-card: #1a1a1a;
  --bg-sidebar: #141414;
  --top-bar-bg: #1f1f1f;
  --border: #3a3a3a;
  --text: #f0f0f0;
  --text-muted: #a8a8a8;
  --top-bar-border: #2a2a2a;
  --success: #4caf50;
  --warning: #ff9800;
  --error: #f44336;
  --info: #2196f3;
  --gold-light: #e6c200;
  --gold-dark: #b8860b;
  --silver: #c0c0c0;
  --silver-dark: #808080;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: var(--bg-main);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 13px;
  line-height: 1.4;
}

.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 48px;
  background: var(--top-bar-bg);
  border-bottom: 1px solid var(--top-bar-border);
  padding: 0 20px;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
  color: var(--primary);
}

.logo-icon {
  width: 24px;
  height: 24px;
  background: linear-gradient(135deg, var(--primary), var(--gold-dark));
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--bg-main);
  font-weight: 700;
}

.top-bar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s;
}

.user-menu:hover {
  background: var(--border);
}

.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 3px;
  background: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--bg-main);
}

.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 220px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-section {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.sidebar-section:last-child {
  border-bottom: none;
}

.sidebar-label {
  padding: 0 16px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  margin: 0 8px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-muted);
  font-size: 13px;
  border-left: 2px solid transparent;
}

.nav-item:hover {
  background: var(--bg-card);
  color: var(--text);
}

.nav-item.aivic-active {
  background: rgba(212, 175, 55, 0.1);
  color: var(--primary);
  border-left-color: var(--primary);
}

.nav-icon {
  width: 16px;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.content-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

[data-aivic-panel] {
  width: 100%;
  height: 100%;
}

.page-header {
  padding: 24px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-main);
  position: sticky;
  top: 0;
  z-index: 10;
}

.page-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.page-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.page-content {
  padding: 20px 28px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 16px;
}

.kpi-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.kpi-value {
  font-size: 24px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 4px;
}

.kpi-change {
  font-size: 12px;
  color: var(--success);
}

.search-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}

.search-input {
  flex: 1;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
}

.filter-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 12px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
}

.filter-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

thead {
  background: var(--bg-main);
  border-bottom: 1px solid var(--border);
}

th {
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

tbody tr:hover {
  background: rgba(212, 175, 55, 0.05);
}

tbody tr:last-child td {
  border-bottom: none;
}

.status-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
}

.status-active {
  background: rgba(76, 175, 80, 0.15);
  color: var(--success);
}

.status-draft {
  background: rgba(255, 152, 0, 0.15);
  color: var(--warning);
}

.status-archived {
  background: rgba(168, 168, 168, 0.15);
  color: var(--text-muted);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 4px;
  border: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--primary);
  color: var(--bg-main);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
}

.btn-secondary:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.btn-sm {
  padding: 5px 10px;
  font-size: 12px;
}

.split-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  height: 100%;
}

.split-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.split-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-main);
}

.split-content {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
}

.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.1);
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.diff-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px 28px;
}

.diff-panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.diff-header {
  padding: 12px 16px;
  background: var(--bg-main);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.diff-content {
  padding: 16px;
  font-family: 'Monaco', 'Menlo', monospace;
  font-size: 12px;
  line-height: 1.6;
  max-height: 600px;
  overflow-y: auto;
}

.diff-line {
  padding: 2px 0;
  margin: 0;
}

.diff-added {
  background: rgba(76, 175, 80, 0.1);
  color: var(--success);
}

.diff-removed {
  background: rgba(244, 67, 54, 0.1);
  color: var(--error);
}

.stepper {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.step {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-right: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  font-size: 12px;
  color: var(--text-muted);
}

.step:last-child {
  border-right: none;
}

.step.active {
  background: rgba(212, 175, 55, 0.1);
  color: var(--primary);
  font-weight: 600;
}

.step:hover {
  background: var(--bg-main);
}

.version-list {
  list-style: none;
}

.version-item {
  padding: 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: background 0.2s;
}

.version-item:hover {
  background: var(--bg-main);
}

.version-item:last-child {
  border-bottom: none;
}

.version-info {
  flex: 1;
}

.version-number {
  font-weight: 600;
  color: var(--text);
  font-size: 13px;
  margin-bottom: 2px;
}

.version-meta {
  font-size: 11px;
  color: var(--text-muted);
}

.version-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 4px 8px;
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 11px;
  transition: all 0.2s;
}

.action-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}

.modal-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
}

.modal-body {
  padding: 16px;
}

.modal-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.tag {
  display: inline-block;
  padding: 3px 8px;
  background: rgba(212, 175, 55, 0.15);
  color: var(--primary);
  border-radius: 3px;
  font-size: 11px;
  font-weight: 500;
}

.scrollbar-thin::-webkit-scrollbar {
  width: 6px;
}

.scrollbar-thin::-webkit-scrollbar-track {
  background: transparent;
}

.scrollbar-thin::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}

.scrollbar-thin::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

.sidebar {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.content-area {
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

を目的とした包括的なデジタル変革を推進するプロジェクトです。経営層からの指摘を踏まえ、ROI最大化と実装リスク低減を重視した計画に大幅改訂いたしました。\n\n【実施体制】\nプロジェクト責任者：山田太郎（CTO）、推進チーム：15名\n\n【主要施策】\n1. 基幹システムのクラウド移行（Phase 1: 2025年4月〜9月）\n2. データ分析基盤の構築（Phase 2: 2025年10月〜2026年3月）\n3. 業務プロセス自動化（Phase 3: 2026年4月〜）\n\n【投資規模】\n総額：2億5,000万円（前版比▲30%削減）\n初年度：1億2,000万円\n\n【期待効果】\n- 運用コスト年間3,500万円削減\n- 業務効率化による生産性向上：25%\n- システム保守工数削減：40%\n\n【リスク対応】\nベンダーロックイン対策、段階的導入による実装リスク最小化、要員育成計画の強化","ステータス":"承認待ち","作成者ID":"rec-u-20240501-008","作成日時":"2025-02-15T14:30:00+09:00","更新日時":"2025-02-15T14:30:00+09:00","備考":"経営会議（2025年2月10日）での指摘事項を全て反映。前版からの主な変更：①投資規模の30%削減、②ROI試算の詳細化、③リスク対応策の強化、④段階的実装スケジュールの明確化。次回レビュー予定日：2025年2月28日"},{"バージョンID":"rec-001-v2-20250115","提案資料ID":"rec-001-prop-20241201","バージョン番号":2,"タイトル":"AI導入提案書_顧客質問対応版","内容":"前回の提案に対して頂いた質問への補足説明です。\n\n【質問1】導入期間について\n当初の3ヶ月から4ヶ月への変更理由：既存システムとの連携テストに予想以上の時間が必要となったため、安定稼働を優先し期間を延長いたしました。\n\n【質問2】コスト削減効果について\n初年度の効果試算を添付の詳細資料で提示いたします。事務作業時間の削減により、月額約45万円の効果を見込んでおります。\n\n【質問3】セキュリティ対策について\nISO27001認証取得済みのクラウドサービスを採用し、データ暗号化、アクセス制御、定期的なセキュリティ監査を実施いたします。詳細は別紙セキュリティ仕様書をご参照ください。","ステータス":"承認待ち","作成者ID":"rec-user-20240401","作成日時":"2025-01-15T14:30:00+09:00","更新日時":"2025-01-15T14:30:00+09:00","備考":"顧客（株式会社山田商事 営業部長 佐藤次郎）からの1月10日付けメール質問3項目に対応した補足版。初版から導入期間、コスト効果、セキュリティ対策の3点を詳細化。営業担当者：鈴木花子が作成。次回会議は1月22日予定。"},{"バージョンID":"rec-001-v2024-1127-a8f3","提案資料ID":"rec-001-prop-2024-1015","バージョン番号":3,"タイトル":"◎◎システム導入提案書（法務確認版）","内容":"【提案概要】\n当社が提供する◎◎システムの導入により、貴社の業務効率化を実現いたします。\n\n【契約条件】\n・導入期間：2025年2月〜4月（3ヶ月）\n・初期構築費：850万円\n・月額運用費：45万円（12ヶ月契約）\n・保守サポート：平日9:00-18:00対応\n・SLA：99.5%の可用性を保証\n\n【法務確認後の修正項目】\n・秘密保持契約条項を追加（有効期間5年）\n・個人情報の取り扱いについて改正個人情報保護法に準拠\n・契約解除条件を明確化（6ヶ月前通知が必要）\n・損害賠償責任の上限を年間費用の12ヶ月分に設定\n・知的財産権の帰属を明示\n\n【実装スケジュール】\n2025年2月：要件定義、環境構築\n2025年3月：システム開発、テスト\n2025年4月：本番運用開始、トレーニング実施","ステータス":"承認待ち","作成者ID":"rec-001-user-2024-0523","作成日時":"2024-11-27T14:30:00+09:00","更新日時":"2024-11-27T14:30:00+09:00","備考":"法務部（山田花子）による契約条件チェック完了。秘密保持条項、個人情報保護、契約解除条件、損害賠償責任上限、知的財産権帰属について修正。営業部長（佐藤次郎）の承認待ち。"},{"バージョンID":"rec-001","提案資料ID":"rec-002","バージョン番号":2,"タイトル":"システム導入提案書（修正版）- 2025年1月","内容":"貴社向けシステム導入提案の修正版です。\n\n【提案内容】\n業務管理システムの導入による業務効率化\n\n【納品スケジュール】\n・要件定義：2025年2月〜3月\n・開発期間：2025年4月〜8月\n・テスト期間：2025年9月\n・本番稼働：2025年10月\n\n【見積額】\n・システム開発費：4,200,000円\n・導入支援費：800,000円\n・研修費：300,000円\n・合計：5,300,000円\n\n【支払条件】\n・契約時：50%（2,650,000円）\n・本番稼働時：50%（2,650,000円）\n\n【変更内容】\n前版からの値引き対応により、総額を6,500,000円から5,300,000円に修正いたしました。","ステータス":"承認待ち","作成者ID":"rec-003","作成日時":"2025-01-15T10:30:00+09:00","更新日時":"2025-01-15T10:30:00+09:00","備考":"顧客との価格交渉を踏まえ、見積額を18.5%削減。開発工程の効率化により対応可能。営業部門と技術部門で合意済み。"},{"バージョンID":"rec-001","提案資料ID":"rec-002","バージョン番号":5,"タイトル":"クラウド基盤統合システム導入提案書（最終版）","内容":"本提案は、貴社の既存システムの老朽化対応とDX推進を目的とした、クラウド基盤統合システムの導入に関するものです。\n\n【提案内容】\n1. 現状分析\n既存オンプレミスシステムの保守費用年間2,500万円、システム間のデータ連携の非効率性が課題\n\n2. ソリューション\n・AWS上へのマイグレーション\n・マイクロサービスアーキテクチャの採用\n・リアルタイムデータ分析基盤の構築\n\n3. 導入スケジュール\n第1フェーズ（3ヶ月）：基盤構築\n第2フェーズ（4ヶ月）：既存システム段階的移行\n第3フェーズ（2ヶ月）：運用安定化\n\n4. 投資効果\n初期投資：8,500万円\n年間運用費：1,800万円（削減効果：700万円/年）\nROI：12.1ヶ月\n\n5. リスク対策\n・段階的移行による業務継続性の確保\n・24時間サポート体制の構築\n・定期的なセキュリティ監査の実施","ステータス":"承認済み","作成者ID":"rec-003","作成日時":"2025-01-15T14:30:00+09:00","更新日時":"2025-01-28T16:45:00+09:00","備考":"顧客（鈴木商事 CTO 山田花子様）との最終打ち合わせ（2025年1月28日実施）で承認を得た。提案内容に変更なし。契約締結予定日は2025年2月10日。"},{"バージョンID":"rec-v2024-0847","提案資料ID":"rec-p2024-0312","バージョン番号":2,"タイトル":"既存システム拡張提案 - AI分析機能オプション追加","内容":"既にご導入いただいているERPシステムに対して、AI駆動の売上予測分析機能を追加するオプションサービスのご提案です。\n\n【提案内容】\n・リアルタイム売上データ分析\n・3ヶ月先までの需要予測\n・異常検知アラート機能\n・カスタムダッシュボード\n\n【導入スケジュール】\n2025年2月中旬：要件定義\n2025年3月：開発・テスト\n2025年4月：本番環境への展開\n\n【料金】\n初期導入費用：850,000円\n月額利用料：120,000円（年間契約時は月額100,000円）\n\n【期待効果】\n在庫削減率：15～20%\n予測精度：92%以上\n意思決定時間短縮：40%","ステータス":"承認待ち","作成者ID":"rec-u2024-1156","作成日時":"2025-01-15T10:30:00+09:00","更新日時":"2025-01-15T10:30:00+09:00","備考":"前回バージョン（v1）からの変更点：料金プランを年間契約割引対応に修正、導入スケジュールを2ヶ月短縮、ROI試算シートを別紙で追加。営業部長・佐藤次郎からのフィードバックを反映済み。"},{"バージョンID":"rec-001-v3","提案資料ID":"rec-001","バージョン番号":3,"タイトル":"2025年度デジタル化推進プロジェクト提案書","内容":"既承認の2024年度プロジェクトをベースに、新規部門への展開を追加。業務効率化ツールの導入により、事務作業時間を30%削減見込み。初期投資1,200万円、3年で投資回収予定。実施体制：プロジェクト管理室（山田花子リード）、IT企画部、各部門代表者。スケジュール：4月要件定義、6月システム選定、9月導入開始、12月本稼働。リスク対策：ベンダーロックイン回避、従業員教育の充実化。","ステータス":"承認済み","作成者ID":"rec-user-045","作成日時":"2025-02-14T09:30:00+09:00","更新日時":"2025-02-28T14:15:00+09:00","備考":"前年度承認版（v1）の実績データを反映し、新部門適用版として再構成。営業部、企画部からの追加要望を盛り込み、投資効果の根拠を強化。経営会議での質疑応答内容を踏まえ、ROI試算を詳細化。"},{"バージョンID":"rec-001","提案資料ID":"rec-prop-2024-001","バージョン番号":2,"タイトル":"クラウド基盤構築提案書（修正版）","内容":"前回の却下理由を踏まえ、以下の点を改善いたしました。\n\n【改善内容】\n1. コスト削減：初期投資を15%削減し、月額運用費を3万円削減\n2. セキュリティ強化：ISO27001認証取得済みのベンダーを採用\n3. 移行期間短縮：従来の6ヶ月から3ヶ月への短縮を実現\n4. サポート体制：24時間日本語サポートを追加\n\n【提案内容】\nAWSを基盤とした段階的なクラウド移行を実施します。第1段階でテスト環境構築、第2段階で本番環境への移行を行い、リスク最小化を図ります。\n\n【費用見積もり】\n初期構築費用：450万円\n月額運用費：12万円\n\n【期待効果】\nシステム稼働率99.9%以上、運用コスト年間100万円削減","ステータス":"承認待ち","作成者ID":"rec-user-2024-015","作成日時":"2024-12-15T10:30:00+09:00","更新日時":"2024-12-15T10:30:00+09:00","備考":"顧客からの却下理由「コスト高、セキュリティ懸念、移行期間長期化」に対応。営業部長・佐藤健一と顧客IT部長・山田花子との協議を経て修正。次回提案日時：2024年12月22日"}],"変更履歴":[{"変更履歴ID":"rec-001","対象テーブル":"契約書","対象ID":"rec-0042","変更種別":"作成","変更フィールド":"基本情報一括作成","変更前値":null,"変更後値":"契約書番号: CTR-2024-0891, 顧客名: 株式会社ビジネスソリューション, 契約金額: 2,500,000円, 契約開始日: 2024-04-01, 契約終了日: 2025-03-31, ステータス: 作成中","変更理由":"新規営業案件に基づく契約書初回作成","作成者ID":"rec-0156","作成日時":"2024-03-15T09:30:00+09:00"},{"変更履歴ID":"rec-20250215-001","対象テーブル":"契約書","対象ID":"rec-contract-2024-0847","変更種別":"更新","変更フィールド":"契約金額","変更前値":"2,500,000","変更後値":"2,350,000","変更理由":"顧客（株式会社山田商事）からの値引き要望に対応。営業担当者の判断により150万円の減額を承認。","作成者ID":"rec-user-営業部-0521","作成日時":"2025-02-15 14:32:18"},{"変更履歴ID":"rec-20250115-001","対象テーブル":"契約書","対象ID":"rec-contract-2024-0847","変更種別":"ステータス変更","変更フィールド":"ステータス","変更前値":"承認待ち","変更後値":"承認済み","変更理由":"法務部による内容確認完了。条項の適法性確認、リスク評価を実施し問題なし。","作成者ID":"rec-user-2024-0312","作成日時":"2025-01-15T14:32:18+09:00"},{"変更履歴ID":"rec-20250115-00847","対象テーブル":"契約書","対象ID":"rec-contract-2024-0156","変更種別":"更新","変更フィールド":"有効期限","変更前値":"2025-03-31","変更後値":"2026-03-31","変更理由":"顧客との協議により契約期間を1年間延長することが決定。既存契約の継続性を考慮し、自動更新       if (role === "dialog" || role === "alertdialog" || role === "tooltip" || role === "menu") return true;
      if (el.hasAttribute && (el.hasAttribute("data-modal") || el.hasAttribute("data-dropdown") || el.hasAttribute("data-popup") || el.hasAttribute("data-aivic-overlay"))) return true;
      // 【2026-06-25】 class/role が無くても inline で画面を覆う overlay ( position:fixed ) は modal 扱いにして、
      //  content 強制可視化が誤ってダイアログをロード時に表示してしまわないようにする。
      if (el.style && el.style.position === "fixed") return true;
      return false;
    };
    var unhideContentElements = function(root) {
      var all = root.querySelectorAll('.hidden, [hidden], [style*="display:none"], [style*="display: none"]');
      for (var k = 0; k < all.length; k++) {
        var el = all[k];
        if (isModalLike(el)) continue;
        var p = el.parentElement;
        var insideModal = false;
        while (p && p !== root) {
          if (isModalLike(p)) { insideModal = true; break; }
          p = p.parentElement;
        }
        if (insideModal) continue;
        el.classList.remove('hidden');
        el.removeAttribute('hidden');
        if (el.style && el.style.display === 'none') el.style.display = '';
      }
    };
    try { unhideContentElements(container); } catch (e) { console.warn('[aivic] unhideContent failed:', e); }

    var initJsSource = window.AIVIC_PAGE_INIT_JS;
    if (!initJsSource) {
      seedAllIfEmpty();
      return;
    }
    var initFn = null;
    try {
      initFn = (new Function("return (" + initJsSource + ")"))();
    } catch (e) {
      console.error("[aivic] initJs compile error:", pageScreenId, e);
      return;
    }
    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
