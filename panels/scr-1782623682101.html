<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>契約・成果管理ポータル</title>
  <style>
:root {
  --primary: #d4af37;
  --primary-hover: #c9a23e;
  --secondary: #c0c0c0;
  --secondary-hover: #a8a8a8;
  --bg-main: #0f0e0a;
  --bg-card: #1a1815;
  --bg-sidebar: #141310;
  --top-bar-bg: #0d0c09;
  --border: #3d3a2f;
  --text: #f5f3f0;
  --text-muted: #a89f96;
  --top-bar-border: #4a4530;
  --success: #6ba547;
  --warning: #d4a574;
  --error: #c92a2a;
  --info: #b8860b;
  --hover-overlay: rgba(212, 175, 55, 0.08);
  --focus-ring: #d4af37;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 12px rgba(212, 175, 55, 0.1);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
  background: var(--bg-main);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  font-size: 13px;
  line-height: 1.4;
}

body {
  display: flex;
  flex-direction: column;
}

.top-bar {
  height: 48px;
  background: var(--top-bar-bg);
  border-bottom: 1px solid var(--top-bar-border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  flex-shrink: 0;
}

.logo {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.5px;
}

.top-bar-spacer {
  flex: 1;
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.user-menu a {
  color: var(--primary);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.2s;
}

.user-menu a:hover {
  color: var(--primary-hover);
}

.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  width: 200px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  flex-shrink: 0;
}

.sidebar-section {
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.sidebar-section:last-child {
  border-bottom: none;
}

.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 8px 12px;
}

.sidebar-item {
  padding: 8px 12px;
  cursor: pointer;
  color: var(--text-muted);
  transition: all 0.2s;
  font-size: 12px;
  border-left: 2px solid transparent;
  display: block;
  text-decoration: none;
}

.sidebar-item:hover {
  background: var(--hover-overlay);
  color: var(--text);
}

.sidebar-item.aivic-active {
  background: var(--hover-overlay);
  color: var(--primary);
  border-left-color: var(--primary);
}

.content-area {
  flex: 1;
  overflow-y: auto;
  background: var(--bg-main);
}

[data-aivic-panel] {
  min-height: 100%;
}

.page-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
}

.page-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.page-subtitle {
  font-size: 12px;
  color: var(--text-muted);
}

.page-body {
  padding: 20px 24px;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 14px;
}

.kpi-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 6px;
}

.kpi-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
}

.kpi-delta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.table-wrapper {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

thead {
  background: var(--bg-sidebar);
  border-bottom: 1px solid var(--border);
}

th {
  padding: 10px 12px;
  text-align: left;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

tbody tr:hover {
  background: var(--hover-overlay);
}

.status-badge {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
}

.status-active {
  background: rgba(107, 165, 71, 0.15);
  color: var(--success);
}

.status-pending {
  background: rgba(212, 165, 116, 0.15);
  color: var(--warning);
}

.status-completed {
  background: rgba(107, 165, 71, 0.15);
  color: var(--success);
}

.status-draft {
  background: rgba(192, 192, 192, 0.15);
  color: var(--secondary);
}

.status-error {
  background: rgba(201, 42, 42, 0.15);
  color: var(--error);
}

.split-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  height: 100%;
}

.split-left, .split-right {
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.detail-section {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 14px;
  margin-bottom: 12px;
}

.detail-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 4px;
}

.detail-value {
  font-size: 13px;
  color: var(--text);
  word-break: break-word;
}

.form-group {
  margin-bottom: 14px;
}

.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-size: 12px;
  font-family: inherit;
  transition: border-color 0.2s;
}

.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--hover-overlay);
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

.button-group {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.btn {
  padding: 8px 14px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-primary {
  background: var(--primary);
  color: var(--bg-main);
}

.btn-primary:hover {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--secondary);
  color: var(--bg-main);
}

.btn-secondary:hover {
  background: var(--secondary-hover);
}

.btn-ghost {
  background: transparent;
  color: var(--primary);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: var(--hover-overlay);
}

.btn-sm {
  padding: 6px 10px;
  font-size: 11px;
}

.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg-card);
  padding: 0 24px;
}

.tab {
  padding: 12px 16px;
  cursor: pointer;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  font-size: 12px;
  font-weight: 600;
  transition: all 0.2s;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.stepper {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.step {
  flex: 1;
  padding: 12px;
  text-align: center;
  border-right: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.step:last-child {
  border-right: none;
}

.step-number {
  display: inline-block;
  width: 24px;
  height: 24px;
  line-height: 24px;
  border-radius: 50%;
  background: var(--bg-sidebar);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 4px;
}

.step.active .step-number {
  background: var(--primary);
  color: var(--bg-main);
}

.step.completed .step-number {
  background: var(--success);
  color: var(--bg-main);
}

.step-label {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 600;
}

.step.active .step-label {
  color: var(--primary);
}

.search-box {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.search-input {
  flex: 1;
  padding: 8px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 3px;
  color: var(--text);
  font-size: 12px;
}

.search-input::placeholder {
  color: var(--text-muted);
}

.filter-chip {
  display: inline-block;
  padding: 6px 10px;
  background: var(--hover-overlay);
  border: 1px solid var(--border);
  border-radius: 3px;
  font-size: 11px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
}

.filter-chip:hover {
  background: rgba(212, 175, 55, 0.15);
}

.filter-chip.active {
  background: var(--primary);
  color: var(--bg-main);
  border-color: var(--primary);
}

.timeline {
  position: relative;
  padding-left: 24px;
}

.timeline-item {
  padding-bottom: 16px;
  position: relative;
}

.timeline-item::before {
  content: '';
  position: absolute;
  left: -24px;
  top: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--primary);
  border: 2px solid var(--bg-main);
}

.timeline-item::after {
  content: '';
  position: absolute;
  left: -20px;
  top: 8px;
  width: 1px;
  height: calc(100% + 8px);
  background: var(--border);
}

.timeline-item:last-child::after {
  display: none;
}

.timeline-date {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 2px;
}

.timeline-content {
  font-size: 12px;
  color: var(--text);
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}

.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  max-width: 500px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
}

.modal-body {
  padding: 16px;
}

.modal-footer {
  padding: 16px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
}

.empty-state-icon {
  font-size: 32px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.empty-state-text {
  font-size: 12px;
}

.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 2px;
  font-size: 10px;
  font-weight: 600;
}

.badge-gold {
  background: rgba(212, 175, 55, 0.2);
  color: var(--primary);
}

.badge-silver {
  background: rgba(192, 192, 192, 0.2);
  color: var(--secondary);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.row.full {
  grid-template-columns: 1fr;
}

.scrollable-table {
  overflow-x: auto;
}

.text-right {
  text-align: right;
}

.text-center {
  text-align: center;
}

.text-muted {
  color: var(--text-muted);
}

.text-primary {
  color: var(--primary);
}

.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const contractTable = tables[0]; // 契約\n  const answerTable = tables[1]; // 回答（仮想テーブル）\n  const historyTable = tables[2]; // 回答履歴（仮想テーブル）\n\n  let selectedContractId = null;\n  let selectedQuestionId = null;\n  let uploadedFiles = [];\n\n  // ===== 契約一覧の初期化 =====\n  async function loadContracts() {\n    const contracts = await window.aivicApi.list(0); // 契約テーブル\n    if (!contracts) return;\n\n    const contractList = container.querySelector('#contract-list');\n    contractList.innerHTML = '';\n\n    contracts.forEach(contract => {\n      const item = document.createElement('div');\n      item.style.cssText = `\n        padding: 8px;\n        border-bottom: 1px solid var(--border);\n        cursor: pointer;\n        font-size: 12px;\n        color: var(--text);\n        transition: background 0.2s;\n      `;\n      item.textContent = contract.契約名 || contract.contractName || '無名契約';\n      item.onmouseover = () => item.style.background = 'var(--bg-hover)';\n      item.onmouseout = () => item.style.background = 'transparent';\n      item.onclick = () => selectContract(contract.id || contract.contractId);\n      contractList.appendChild(item);\n    });\n  }\n\n  // ===== 契約選択時の処理 =====\n  function selectContract(contractId) {\n    selectedContractId = contractId;\n    selectedQuestionId = null;\n    uploadedFiles = [];\n    container.querySelector('#answer-text').value = '';\n    container.querySelector('#file-list').innerHTML = '<div style=\"color: var(--text-muted);\">資料なし</div>';\n    container.querySelector('#question-panel').style.display = 'none';\n    container.querySelector('#history-timeline').innerHTML = '<div>履歴なし</div>';\n    \n    // 実装例: 契約に紐付く質問を取得して表示\n    // ここでは簡易的に質問パネルを表示\n    container.querySelector('#question-panel').style.display = 'block';\n    container.querySelector('#question-text').textContent = `契約「${selectedContractId}」に関する質問`;\n    container.querySelector('#question-date').textContent = new Date().toLocaleDateString('ja-JP');\n  }\n\n  // ===== ファイルアップロード処理 =====\n  const uploadZone = container.querySelector('#upload-zone');\n  const fileInput = container.querySelector('#file-input');\n\n  uploadZone.ondragover = (e) => {\n    e.preventDefault();\n    uploadZone.style.borderColor = 'var(--primary)';\n    uploadZone.style.background = 'var(--bg-hover)';\n  };\n\n  uploadZone.ondragleave = () => {\n    uploadZone.style.borderColor = 'var(--border)';\n    uploadZone.style.background = 'var(--bg-main)';\n  };\n\n  uploadZone.ondrop = (e) => {\n    e.preventDefault();\n    uploadZone.style.borderColor = 'var(--border)';\n    uploadZone.style.background = 'var(--bg-main)';\n    handleFiles(e.dataTransfer.files);\n  };\n\n  fileInput.onchange = (e) => {\n    handleFiles(e.target.files);\n  };\n\n  function handleFiles(files) {\n    Array.from(files).forEach(file => {\n      uploadedFiles.push({\n        name: file.name,\n        size: file.size,\n        type: file.type,\n        file: file\n      });\n    });\n    updateFileList();\n  }\n\n  function updateFileList() {\n    const fileList = container.querySelector('#file-list');\n    if (uploadedFiles.length === 0) {\n      fileList.innerHTML = '<div style=\"color: var(--text-muted);\">資料なし</div>';\n      return;\n    }\n\n    fileList.innerHTML = uploadedFiles.map((f, idx) => `\n      <div style=\"padding: 6px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;\">\n        <div style=\"flex: 1;\">\n          <div style=\"color: var(--text); word-break: break-word;\">${f.name}</div>\n          <div style=\"font-size: 10px; color: var(--text-muted);\">${(f.size / 1024).toFixed(1)} KB</div>\n        </div>\n        <button type=\"button\" class=\"delete-file-btn\" data-index=\"${idx}\" style=\"background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 14px;\">×</button>\n      </div>\n    `).join('');\n\n    container.querySelectorAll('.delete-file-btn').forEach(btn => {\n      btn.onclick = (e) => {\n        const idx = parseInt(e.target.dataset.index);\n        uploadedFiles.splice(idx, 1);\n        updateFileList();\n      };\n    });\n  }\n\n  // ===== 保存・公開処理 =====\n  container.querySelector('#save-draft-btn').onclick = async () => {\n    if (!selectedContractId) {\n      alert('契約を選択してください');\n      return;\n    }\n    const answerText = container.querySelector('#answer-text').value;\n    if (!answerText.trim()) {\n      alert('回答を入力してください');\n      return;\n    }\n\n    const payload = {\n      contractId: selectedContractId,\n      answerText: answerText,\n      status: 'draft',\n      publishDate: null,\n      publishTarget: null,\n      files: uploadedFiles.map(f => f.name)\n    };\n\n    const saved = await window.aivicApi.save(1, payload);\n    if (saved) {\n      alert('下書きを保存しました');\n      addToHistory('下書き保存', answerText);\n    }\n  };\n\n  container.querySelector('#save-btn').onclick = async () => {\n    if (!selectedContractId) {\n      alert('契約を選択してください');\n      return;\n    }\n    const answerText = container.querySelector('#answer-text').value;\n    if (!answerText.trim()) {\n      alert('回答を入力してください');\n      return;\n    }\n\n    const payload = {\n      contractId: selectedContractId,\n      answerText: answerText,\n      status: 'saved',\n      publishDate: null,\n      publishTarget: null,\n      files: uploadedFiles.map(f => f.name)\n    };\n\n    const saved = await window.aivicApi.save(1, payload);\n    if (saved) {\n      alert('回答を保存しました');\n      addToHistory('保存', answerText);\n    }\n  };\n\n  container.querySelector('#publish-btn').onclick = async () => {\n    if (!selectedContractId) {\n      alert('契約を選択してください');\n      return;\n    }\n    const answerText = container.querySelector('#answer-text').value;\n    if (!answerText.trim()) {\n      alert('回答を入力してください');\n      return;\n    }\n\n    const publishDate = container.querySelector('#publish-date').value;\n    const publishTarget = container.querySelector('#publish-target').value;\n    const publishImmediately = container.querySelector('#publish-immediately').checked;\n\n    if (!publishTarget) {\n      alert('公開対象を選択してください');\n      return;\n    }\n\n    const payload = {\n      contractId: selectedContractId,\n      answerText: answerText,\n      status: publishImmediately ? 'published' : 'scheduled',\n      publishDate: publishImmediately ? new Date().toISOString() : publishDate,\n      publishTarget: publishTarget,\n      files: uploadedFiles.map(f => f.name)\n    };\n\n    const saved = await window.aivicApi.save(1, payload);\n    if (saved) {\n      alert(publishImmediately ? '回答を公開しました' : '公開予定を設定しました');\n      addToHistory(publishImmediately ? '公開' : '公開予定設定', answerText);\n    }\n  };\n\n  container.querySelector('#back-btn').onclick = () => {\n    window.showScreen('scr-1782623640991'); // ポータル確認画面へ\n  };\n\n  // ===== 履歴追加 =====\n  function addToHistory(action, text) {\n    const timeline = container.querySelector('#history-timeline');\n    const now = new Date().toLocaleString('ja-JP');\n    const entry = document.createElement('div');\n    entry.style.cssText = `\n      padding: 6px;\n      border-left: 2px solid var(--primary);\n      margin-bottom: 6px;\n      padding-left: 8px;\n    `;\n    entry.innerHTML = `\n      <div style=\"font-size: 11px; color: var(--primary); font-weight: 600;\">${action}</div>\n      <div style=\"font-size: 10px; color: var(--text-muted);\">${now}</div>\n    `;\n    if (timeline.textContent === '履歴なし') {\n      timeline.innerHTML = '';\n    }\n    timeline.insertBefore(entry, timeline.firstChild);\n  }\n\n  // 初期ロード\n  loadContracts();\n}";

    if (typeof initFn !== "function") return;

    seedAllIfEmpty().then(function() {
      return Promise.all(TABLE_DEFS.map(function(t, i) {
        return window.aivicApi.list(i)
          .then(function(records) { return Object.assign({}, t, { records: records }); })
          .catch(function() { return Object.assign({}, t, { records: [] }); });
      }));
    }).then(function(tables) {
      try { initFn(container, API_URL, tables); } catch (e) { console.error("[aivic] initFn error:", pageScreenId, e); }
      _aivicReady = true;
    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
