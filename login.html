<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>匠の案件管理 - ログイン画面</title>
  <style>
    :root {
      /* Primary Color - Gold (金) */
      --primary: #d4af37;
      --primary-hover: #c9a23e;
      
      /* Background - Dark theme with silver/gold undertones */
      --bg-main: #0f0f0f;
      --bg-card: #1a1a1a;
      --bg-sidebar: #141414;
      --top-bar-bg: #1f1f1f;
      
      /* Border */
      --border: #2a2a2a;
      
      /* Text */
      --text: #e8e8e8;
      --text-muted: #a0a0a0;
      
      /* Top Bar */
      --top-bar-border: #3a3a3a;
      
      /* Additional semantic colors */
      --success: #4caf50;
      --success-light: #81c784;
      --error: #f44336;
      --error-light: #ef5350;
      --warning: #ff9800;
      --warning-light: #ffb74d;
      --info: #2196f3;
      --info-light: #64b5f6;
      
      /* Accent - Silver (銀) */
      --accent: #c0c0c0;
      --accent-dark: #a8a8a8;
      
      /* Shadow */
      --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 8px rgba(212, 175, 55, 0.1);
      --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.4);
      
      /* Opacity */
      --opacity-disabled: 0.5;
      --opacity-hover: 0.85;
      
      /* Spacing */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      
      /* Border Radius */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      
      /* Transitions */
      --transition-fast: 150ms ease-in-out;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--spacing-md);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }

    .login-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--spacing-md);
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 24px;
      color: var(--bg-main);
      box-shadow: var(--shadow-md);
    }

    .login-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--spacing-sm);
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      background-color: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md) var(--spacing-md);
      color: var(--text);
      font-size: 14px;
      transition: all var(--transition-fast);
      font-family: inherit;
    }

    .form-input::placeholder {
      color: var(--text-muted);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      background-color: rgba(212, 175, 55, 0.05);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    .form-input:hover:not(:focus) {
      border-color: var(--accent-dark);
    }

    .login-button {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      color: var(--bg-main);
      border: none;
      border-radius: var(--radius-md);
      padding: var(--spacing-md) var(--spacing-lg);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: var(--shadow-md);
      margin-top: var(--spacing-sm);
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(212, 175, 55, 0.2);
    }

    .login-button:active {
      transform: translateY(0);
    }

    .login-footer {
      margin-top: var(--spacing-xl);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .login-footer-note {
      color: var(--accent-dark);
      font-style: italic;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: var(--spacing-lg);
      }

      .login-title {
        font-size: 20px;
      }

      .login-button {
        padding: var(--spacing-md) var(--spacing-md);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">匠</div>
        <h1 class="login-title" data-testid="login-title">匠の案件管理</h1>
        <p class="login-subtitle">営業データ品質管理・請求自動化システム</p>
      </div>

      <form class="login-form" data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button
          class="login-button"
          type="submit"
          data-testid="login-button"
        >
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <p class="login-footer-note">
          ※ サンプル実装ではどの入力でもログインできます
        </p>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
